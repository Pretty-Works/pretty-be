# 시크릿은 .env 로 주입한다. 이 파일에는 실제 값을 적지 않는다.
#   cp .env.example .env   후 값 채우기
#
# spring.config.import 가 .env 를 properties 로 읽어 ${...} 참조를 해결한다.
# optional: 이라 파일이 없어도(Docker 환경 등) 그대로 뜬다.

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/prettyworks?characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP는 starter-data-jpa에 딸려와 기본으로 돌지만, 값을 적어두지 않으면
    # 기준선이 없어 문제가 생겨도 어디를 조일지 알 수 없습니다.
    hikari:
      # 톰캣 요청 스레드와 에이전트 실행 스레드(agent.execution.threads)가 함께 씁니다.
      # 늘리기 전에 MySQL max_connections(기본 151)를 확인해야 합니다 — 인스턴스가 여러 대면 그 합이 넘지 않아야 합니다.
      # 실행 스레드 24개가 최악으로 다 물어도 웹 요청 몫 16이 남도록 잡은 값입니다.
      # 사용자 수가 아니라 "동시에 도는 쿼리 수"로 정합니다 — 커넥션은 쿼리 도는 동안만 잡습니다.
      maximum-pool-size: ${DB_POOL_SIZE:40}
      # 기본값은 최대치와 같아서 놀 때도 그만큼 물고 있습니다.
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # 기본 30초는 너무 깁니다. 커넥션이 마르면 빨리 실패해 원인을 드러내는 편이 낫습니다.
      connection-timeout: 5000
      # 20초 넘게 커넥션을 돌려주지 않는 코드를 스택트레이스와 함께 경고로 남깁니다.
      # SSE·에이전트 실행처럼 오래 도는 작업이 있어 새는 자리를 조기에 잡습니다.
      leak-detection-threshold: 20000
      pool-name: PrettyWorksPool

  data:
    redis:
      # 다중 인스턴스에 에이전트 이벤트를 전파하는 Pub/Sub 채널로 씁니다.
      # 단일 인스턴스 로컬 개발에서는 없어도 동작합니다(fail-open).
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  jpa:
    # 스키마 정본은 src/main/resources/db/init.sql 입니다.
    # 엔티티와 어긋나면 앱이 뜨지 않습니다 — 의도된 안전장치입니다.
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        order_inserts: true

  web:
    resources:
      # 정적 리소스 자동 매핑을 꺼서 잘못된 URL이 정적 처리기로 빠지지 않게 합니다.
      # 테스트 페이지(test.html)는 WebConfig에서 path 단위로 명시적 매핑.
      add-mappings: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: "Asia/Seoul"

logging:
  file:
    # 콘솔 출력은 그대로 두고 파일에도 남깁니다. Redis 장애 시의 fail-open 경고처럼
    # "조용히 실패"하는 로그는 콘솔만으로는 놓치기 때문에 보존이 필요합니다.
    name: logs/prettyworks.log
  pattern:
    # [traceId] — MdcFilter가 요청마다 넣는 추적 ID. 한 요청이 남긴 로그를 이 값으로 묶어서 볼 수 있습니다.
    # 요청 스레드 밖(부팅·스케줄러)에서는 비어 있는 것이 정상입니다.
    #
    # %clr(...)은 스프링 부트가 제공하는 색상 변환어입니다. 색 인자 없이 감싸면 로그 레벨에 따라
    # 자동으로 색이 정해집니다(WARN 노랑 / ERROR 빨강). 이걸 빼면 콘솔이 전부 무채색이 됩니다.
    # %wEx는 예외 스택트레이스를 부트 기본 형식으로 출력합니다.
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%X{traceId:-}]){magenta} %clr(%logger{36}){cyan} %clr(-){faint} %msg%n%wEx"
    # 파일에는 색을 넣지 않습니다. ANSI 이스케이프 문자가 그대로 기록돼 로그가 읽기 어려워집니다.
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

auth:
  session:
    # 유저당 동시 로그인 세션 수. 초과하면 가장 오래된 세션을 폐기합니다.
    max-per-user: 6
  cookie:
    # HTTPS 배포에서는 true. 로컬 http 개발에서는 false여야 쿠키가 저장됩니다.
    secure: ${AUTH_COOKIE_SECURE:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

cleanup:
  # 정리 배치 실행 주기 — 매일 새벽 4시. 멱등 키와 만료된 로그인 세션을 함께 정리합니다.
  # 로컬에서 동작을 확인할 때는 "*/10 * * * * *" 처럼 짧게 두면 됩니다.
  cron: "0 0 4 * * *"

idempotency:
  # 멱등 키 보관 시간. 이 시간이 지난 키는 정리 배치가 삭제하며, 삭제 후 같은 키로 요청하면 새로 생성됩니다.
  # (재시도 창 자체는 분 단위면 충분하지만, 중복 등록 신고 시 추적할 수 있도록 여유를 둡니다)
  retention-hours: 24

agent:
  server:
    # 에이전트(FastAPI) 서버 주소. LLM팀이 별도 저장소에서 운영하며, 외부에는 공개하지 않습니다.
    url: ${AGENT_SERVER_URL:http://localhost:3002}
    # 연결 자체는 즉시 되거나 안 되거나입니다. 길게 잡을 이유가 없습니다.
    connect-timeout: 3000
    # 회의록 초안 생성(/api/agent/meeting-draft) 전용. 녹취록 30,000자를 요약하면 60초를 넘길 수 있습니다.
    draft-timeout: 120000
  internal:
    # FastAPI → BE 내부 도구 API(/api/internal/agent/**)의 호출자 인증 키.
    api-key: ${AGENT_INTERNAL_API_KEY}
    approval-token-ttl-minutes: 10
    # 토큰 원문을 DB에 저장하지 않고 재시작 후 동일 토큰을 복구하기 위한 HMAC 비밀키입니다.
    approval-token-secret: ${AGENT_APPROVAL_TOKEN_SECRET}
  events:
    # 종료 직전에 연결이 끊긴 브라우저가 done/error를 재생할 수 있도록 즉시 지우지 않습니다.
    retention-hours: 1
    # DB가 원본이고 Redis는 다중 인스턴스에 새 시퀀스를 깨우는 알림으로만 사용합니다.
    channel: agent-events-v2
  stream:
    heartbeat-millis: 15000
    segment-timeout-millis: 600000
    max-connections-per-user: 5
  run:
    # RUNNING 실행의 총 시간 상한입니다. 활동이 계속돼도 이 시간을 넘기지 않습니다.
    max-duration-minutes: 2160     # 36시간
    # 개인 한도는 대기까지 포함해 셉니다 — 답하지 않은 카드를 한 사람이 무한정 쌓지 못하게 합니다.
    max-active-per-user: 10
    # 총량은 실제로 도는 것(RUNNING)만 셉니다. 대기 중인 실행은 자원을 쓰지 않는데 함께 세면
    # 승인을 미룬 몇 사람이 전사 에이전트를 막습니다(승인 대기가 12시간이라 더 그렇습니다).
    #
    # 실행 스레드(24)보다 조금 위로 둡니다. 같게 두면 25번째 요청이 곧바로 거절돼 큐를 못 쓰고,
    # 크게 두면 스레드를 못 받은 실행이 RUNNING인 채 빈 화면만 보여줍니다.
    # 8건 여유면 대기해도 8 ÷ 24 × 80초 ≈ 27초 안에 차례가 옵니다.
    # 코드가 읽는 키는 max-active-total 입니다(AgentRunFactory).
    max-active-total: ${AGENT_RUN_MAX_ACTIVE_TOTAL:32}
  lifecycle:
    # 승인·질문 만료와 고아 RUNNING 정리는 일일 데이터 cleanup과 분리합니다.
    sweep-millis: 60000
  interaction:
    # 승인·질문에 답을 기다리는 시간. 넘기면 실행도 EXPIRED로 함께 닫힙니다.
    # 밤새 돌려두고 아침에 승인하는 흐름을 위해 12시간으로 둡니다.
    # 실행 수명(run.max-duration-minutes)보다 짧아야 합니다 — 길면 실행이 먼저 죽어
    # 답할 수 없는 카드만 홈에 남습니다.
    ttl-minutes: 720               # 12시간
  execution:
    # FastAPI SSE 소비는 블로킹 작업이므로 톰캣 요청 스레드와 분리하고 대기열도 제한합니다.
    # 기다리는 시간이 대부분이라 CPU 수보다 크게 잡습니다.
    #
    # 24는 점유 시간 측정에서 나온 값입니다 — 세그먼트 평균 80초, 임직원 500명 피크 기준
    # 동시 27건까지 나올 수 있어 그걸 덮습니다. 상한은 DB 커넥션 풀(40)입니다.
    # 실행이 최악으로 24를 물어도 웹 요청 몫 16이 남습니다.
    threads: 24
    queue-capacity: 100
  context:
    # 에이전트에 함께 넘길 이전 대화 수. 많을수록 맥락은 좋아지지만 LLM 토큰이 늘어납니다.
    max-messages: 10
    # screenContext 직렬화 크기 상한(byte). 내용을 해석하지 않으므로 필드 검증이 불가능해
    # 길이로만 막습니다. 프론트가 실수로 목록 전체를 실어 보내는 사고를 여기서 끊습니다.
    max-screen-bytes: 32768
  upload:
    allowed-extensions: ${AGENT_UPLOAD_ALLOWED_EXTENSIONS:txt,docx,pdf,hwp}
    max-files: ${AGENT_UPLOAD_MAX_FILES:5}
    max-file-bytes: ${AGENT_UPLOAD_MAX_FILE_BYTES:10485760}
    max-total-bytes: ${AGENT_UPLOAD_MAX_TOTAL_BYTES:26214400}
  external-url:
    # 에이전트가 사용자를 보낼 수 있는 외부 도메인 화이트리스트.
    allowed-origins: ${AGENT_EXTERNAL_URL_ALLOWED_ORIGINS:https://accounts.google.com}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  # access는 짧게 유지합니다. stateless라 서버가 회수할 수 없어, 수명이 곧 탈취 시 노출 창입니다.
  access-token-expire-period: 1800000       # 30분
  # refresh는 회전(RTR)되며 DB에서 폐기할 수 있어 상대적으로 길게 둡니다.
  refresh-token-expire-period: 1209600000   # 14일

server:
  forward-headers-strategy: framework
